name: Build manuscript
on: [push, pull_request]
jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: manuscript
      - uses: actions/upload-artifact@v7
        with:
          name: thesis-pdf
          path: manuscript/main.pdf
